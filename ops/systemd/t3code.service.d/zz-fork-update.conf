[Service]
ExecStart=
ExecStart=/home/codex/.local/share/pnpm/bin/node /home/codex/.t3code/userdata/fork-current/node_modules/t3/dist/bin.mjs serve --mode web --host 127.0.0.1 --port 41731 --base-dir /home/codex/.t3code /home/codex/work
Environment=T3_FORK_UPDATE_REPOSITORY_PATH=/home/codex/work/t3code
Environment=T3_FORK_UPDATE_REPOSITORY=MaximilianMauroner/t3code
Environment=T3_FORK_UPDATE_UPSTREAM_REPOSITORY=pingdotgg/t3code
Environment=T3_FORK_UPDATE_BRANCH=main
Environment=T3_FORK_UPDATE_UPSTREAM_BRANCH=nightly
Environment=T3_FORK_UPDATE_FORK_REMOTE=origin
Environment=T3_FORK_UPDATE_UPSTREAM_REMOTE=upstream
Environment=T3_FORK_UPDATE_RELEASES_DIR=/home/codex/.t3code/userdata/fork-releases
Environment=T3_FORK_UPDATE_CURRENT_LINK=/home/codex/.t3code/userdata/fork-current
Environment=T3_FORK_UPDATE_SERVICE=t3code.service
Environment=T3_FORK_UPDATE_AUTHORITY_LOCK=/run/t3code-watchdog/authority.lock
SupplementaryGroups=t3code-watchdog
